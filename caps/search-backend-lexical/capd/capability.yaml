capability:
  kind: contract-only
  name: search.backend.lexical
  package_name: search-backend-lexical
  aliases:
    - lexical-index
    - search-backend-lexical
  version: 0.1.0
  title: "Lexical Search Backend (Contract Only)"
  description: >
    Contract-only capability package defining the triRPC surface, topic taxonomy,
    and JSON schemas for a lexical indexing/search backend.
    No implementation is included.

requires:
  trirpc_bus: true
  policy_guard: true
  evidence_emission: true

artifacts:
  rpc:
    - rpc/lexical.index.v0.yaml
  topics:
    - topics/lexical.index.topics.v0.yaml
  schemas:
    - schemas/index_upsert.schema.json
    - schemas/lexical_query.schema.json
    - schemas/lexical_query_response.schema.json
    - schemas/evidence_event.schema.json
