service: vector.index.v0
version: 0

methods:
  Upsert:
    request_schema: schemas/vector_upsert.schema.json
    response_schema: schemas/vector_query_response.schema.json
    semantics:
      - "Registers or updates a document embedding in the vector index."
      - "MUST emit evidence events for allow, deny, and error."

  Query:
    request_schema: schemas/vector_query.schema.json
    response_schema: schemas/vector_query_response.schema.json
    semantics:
      - "Executes a vector similarity query against the backend index."
      - "MUST include correlation_id and trace_id echo."

  GetStatus:
    request_schema: schemas/vector_query.schema.json
    response_schema: schemas/vector_query_response.schema.json
    semantics:
      - "Returns readiness and vector backend health summary."

errors:
  codes:
    - INVALID_ARGUMENT
    - PERMISSION_DENIED
    - QUOTA_EXCEEDED
    - NOT_FOUND
    - UNAVAILABLE
    - INTERNAL
