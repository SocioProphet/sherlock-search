name: lawful-metadata-harvest-search-packet

on:
  pull_request:
    paths:
      - "schemas/lawful-metadata-harvest-search-packet.schema.json"
      - "examples/harvest/lawful-metadata-harvest-search-packet.example.json"
      - "scripts/validate_lawful_metadata_harvest_search_packet.py"
      - ".github/workflows/lawful-metadata-harvest-search-packet.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/lawful-metadata-harvest-search-packet.schema.json"
      - "examples/harvest/lawful-metadata-harvest-search-packet.example.json"
      - "scripts/validate_lawful_metadata_harvest_search_packet.py"
      - ".github/workflows/lawful-metadata-harvest-search-packet.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: python -m pip install jsonschema

      - name: Validate lawful metadata harvest search packet
        run: python scripts/validate_lawful_metadata_harvest_search_packet.py
