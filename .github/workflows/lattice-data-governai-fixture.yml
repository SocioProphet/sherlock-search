name: lattice-data-governai-fixture

on:
  pull_request:
    paths:
      - "fixtures/lattice-data-governai/**"
      - "tools/validate_lattice_data_governai_fixture.py"
      - ".github/workflows/lattice-data-governai-fixture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lattice-data-governai-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Lattice Data/GovernAI Sherlock fixtures
        run: python tools/validate_lattice_data_governai_fixture.py
