name: query-routing-platform-assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Convert query routing record set
        run: python scripts/convert_platform_records.py examples/lattice/query-routing-platform-record-set.example.json --output build/query-routing-index-documents.json
      - name: Validate query routing index documents
        run: python scripts/validate_lattice_platform_asset.py build/query-routing-index-documents.json
