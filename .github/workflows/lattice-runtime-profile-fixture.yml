name: lattice-runtime-profile-fixture

on:
  pull_request:
    paths:
      - "fixtures/lattice-data-governai/runtime-profile-records.sherlock-docs.json"
      - "tools/validate_lattice_runtime_profile_fixture.py"
      - ".github/workflows/lattice-runtime-profile-fixture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lattice-runtime-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Lattice runtime profile Sherlock fixtures
        run: python tools/validate_lattice_runtime_profile_fixture.py
