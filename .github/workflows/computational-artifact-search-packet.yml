name: computational-artifact-search-packet

on:
  pull_request:
    paths:
      - "schemas/computational-artifact-search-packet.schema.json"
      - "examples/computational-artifact/search-packet.example.json"
      - "scripts/validate_computational_artifact_search_packet.py"
      - ".github/workflows/computational-artifact-search-packet.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/computational-artifact-search-packet.schema.json"
      - "examples/computational-artifact/search-packet.example.json"
      - "scripts/validate_computational_artifact_search_packet.py"
      - ".github/workflows/computational-artifact-search-packet.yml"

permissions:
  contents: read

jobs:
  validate-search-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install jsonschema
      - name: Validate computational artifact search packet
        run: python scripts/validate_computational_artifact_search_packet.py
