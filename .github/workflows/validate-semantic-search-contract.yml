name: validate-semantic-search-contract

on:
  pull_request:
    paths:
      - 'caps/semantic-search-bi/**'
      - 'docs/semantic-search/**'
      - '.github/workflows/validate-semantic-search-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'caps/semantic-search-bi/**'
      - 'docs/semantic-search/**'
      - '.github/workflows/validate-semantic-search-contract.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema

      - name: Validate semantic-search contract package and examples
        run: |
          python3 caps/semantic-search-bi/tools/validate_package.py
