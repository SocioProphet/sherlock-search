name: personal-intelligence-cell-search-packet

on:
  pull_request:
    paths:
      - "schemas/professional-intelligence-search-packet.schema.json"
      - "examples/personal-intelligence-cell/search-packet.example.json"
      - "scripts/validate_personal_intelligence_cell_search_packet.py"
      - ".github/workflows/personal-intelligence-cell-search-packet.yml"
      - "README.md"
      - "docs/**"
  push:
    branches:
      - main
    paths:
      - "schemas/professional-intelligence-search-packet.schema.json"
      - "examples/personal-intelligence-cell/search-packet.example.json"
      - "scripts/validate_personal_intelligence_cell_search_packet.py"
      - ".github/workflows/personal-intelligence-cell-search-packet.yml"
      - "README.md"
      - "docs/**"

jobs:
  validate-search-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install jsonschema
      - name: Validate Personal Intelligence Cell search packet
        run: python3 scripts/validate_personal_intelligence_cell_search_packet.py
