name: lattice-platform-assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Lattice platform asset fixtures
        run: python scripts/validate_lattice_platform_asset.py
      - name: Convert Lattice enrichment fixture
        run: python scripts/convert_lattice_enrichments.py examples/lattice/platform-asset-enrichment-set.example.json --output build/lattice-index-documents.json
      - name: Validate generated Sherlock index document
        run: python scripts/validate_lattice_platform_asset.py build/lattice-index-documents.json
      - name: Convert raw Studio PlatformAssetRecordSet fixture
        run: python scripts/convert_platform_records.py examples/lattice/studio-platform-record-set.example.json --output build/studio-index-documents.json
      - name: Validate generated Studio Sherlock index documents
        run: python scripts/validate_lattice_platform_asset.py build/studio-index-documents.json
